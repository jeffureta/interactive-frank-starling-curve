<!-- Do not include footnotes and make it human readable -->
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Frank-Starling Curve Simulation</title>
  
  <!-- Materialize CSS -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/css/materialize.min.css">
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Google+Sans:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="style.css">
</head>
<body class="grey lighten-4">

  <div class="container main-container">
    
    <!-- Main Application Card -->
    <div class="card main-ui-card z-depth-1">
      
      <!-- Graph Section -->
      <div class="graph-section">
        <div class="canvas-wrapper">
          <div class="y-axis-label">Stroke Volume Index (mL/m²)</div>
          <canvas id="starlingCanvas"></canvas>
        </div>
        <div class="x-axis-label">End-Diastolic Volume / Preload (mL)</div>
      </div>

      <div class="divider"></div>

      <!-- Computed Metrics Section -->
      <div class="stats-section">
        <div class="row center-align no-margin">
          <div class="col s6 m3 stat-block">
            <span class="stat-label">Stroke Vol. Index</span>
            <div class="stat-value"><span id="val-svi">22.0</span> <span class="stat-unit">mL/m²</span></div>
            <span class="normal-range-hint">Normal: 33–47 mL/m²</span>
          </div>
          <div class="col s6 m3 stat-block">
            <span class="stat-label">Cardiac Index</span>
            <div class="stat-value"><span id="val-ci">1.6</span> <span class="stat-unit">L/min/m²</span></div>
            <span class="normal-range-hint">Normal: 2.5–4.0 L/min/m²</span>
          </div>
          <div class="col s6 m3 stat-block">
            <span class="stat-label">Ejection Fraction</span>
            <div class="stat-value"><span id="val-ef">61</span><span class="stat-unit">%</span></div>
            <span class="normal-range-hint">Normal: 50–70%</span>
          </div>
          <div class="col s6 m3 stat-block">
            <span class="stat-label">Body Surface Area</span>
            <div class="stat-value"><span id="val-bsa">1.82</span><span class="stat-unit">m²</span></div>
            <span class="normal-range-hint">Derived metric</span>
          </div>
        </div>
      </div>

      <div class="divider"></div>

      <!-- Controls Section -->
      <div class="controls-section">
        
        <!-- Row 1: Patient Demographics & State -->
        <div class="row">
          <div class="col s6 m4 control-block">
            <label class="control-label" for="input-height">Height (cm)</label>
            <input type="number" id="input-height" value="170" class="custom-number-input" />
          </div>
          <div class="col s6 m4 control-block">
            <label class="control-label" for="input-weight">Weight (kg)</label>
            <input type="number" id="input-weight" value="70" class="custom-number-input" />
          </div>
          <div class="col s12 m4 control-block">
            <label class="control-label">Myocardial Contractility</label>
            <div class="custom-select-wrapper">
              <select id="input-inotropy">
                <option value="increased">Increased Inotropy</option>
                <option value="normal">Normal State</option>
                <option value="decreased" selected>Decreased (Heart failure)</option>
              </select>
            </div>
          </div>
        </div>

        <!-- Row 2: Hemodynamic Sliders -->
        <div class="row no-margin">
          <!-- Preload Slider -->
          <div class="col s12 m6 control-block">
            <label class="control-label">End-Diastolic Volume (Preload)</label>
            <div class="slider-wrapper">
              <input type="range" id="input-edv" min="10" max="250" value="65" class="custom-range" />
              <span class="slider-value"><span id="disp-edv">65</span> mL</span>
            </div>
            <span class="normal-range-hint" id="hint-edv">Normal: 109–182 mL</span>
          </div>

          <!-- Afterload Slider -->
          <div class="col s12 m6 control-block">
            <label class="control-label">Mean Arterial Pressure (Afterload)</label>
            <div class="slider-wrapper">
              <input type="range" id="input-map" min="40" max="160" value="60" class="custom-range" />
              <span class="slider-value"><span id="disp-map">60</span> mmHg</span>
            </div>
            <span class="normal-range-hint" id="hint-map">Normal: 70–100 mmHg</span>
          </div>
        </div>

      </div>

    </div>
  </div>

  <!-- Materialize JS and Custom Logic -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/materialize/1.0.0/js/materialize.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
